name: Deploy Georgian Mnemo Trainer

on:
  push:
    branches: [master]
    paths:
      - 'georgian-mnemo/**'
      - '.github/workflows/georgian-mnemo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: georgian-mnemo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
