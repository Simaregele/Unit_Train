<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c31"><title>ქართული · Мнемотренажёр</title><style>:root{--bg:#eef2ed;--card:#fffdf8;--ink:#17201c;--muted:#6b746e;--line:#dce3dd;--green:#2c6a52;--soft:#e5efe9;--red:#a64942}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 5% 0,#d7e9df 0,transparent 28%),radial-gradient(circle at 98% 3%,#f0e3ca 0,transparent 27%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.app{max-width:960px;margin:auto;padding:16px 12px 42px}header{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}h1{margin:0;font-size:clamp(28px,6vw,46px);letter-spacing:-.045em}.sub{color:var(--muted);line-height:1.45;margin-top:5px}.links{display:flex;gap:7px;flex-wrap:wrap}.links a{padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#ffffffb8;color:var(--green);font-size:12px;font-weight:750;text-decoration:none}.toolbar{margin:14px 0 10px;padding:11px;border-radius:17px;background:#fffdf8d9;border:1px solid #fff;display:grid;grid-template-columns:1.4fr 1fr auto;gap:9px}select,button{font:inherit}select{border:1px solid var(--line);background:#f7f8f5;border-radius:12px;padding:10px;color:var(--ink)}button{border:0;border-radius:12px;padding:10px 13px;font-weight:760;cursor:pointer}.shuffle{background:var(--soft)}.meta{display:flex;justify-content:space-between;align-items:center;gap:9px;color:var(--muted);font-size:12px;margin:8px 2px}.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:6px 9px}.stage{perspective:1400px;max-width:680px;margin:auto}.card{height:min(68vh,650px);min-height:480px;position:relative;transform-style:preserve-3d;transition:.48s transform cubic-bezier(.2,.75,.2,1);cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:27px;overflow:hidden;background:var(--card);border:1px solid #fff;box-shadow:0 22px 68px rgba(24,46,36,.12)}.back{transform:rotateY(180deg)}.center{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}.ka{font-family:"Noto Sans Georgian","DejaVu Sans",sans-serif;font-size:clamp(58px,14vw,105px);font-weight:830;line-height:1.08}.ru{font-size:clamp(36px,8vw,62px);font-weight:830;line-height:1.1}.hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:#97a099}.scene{height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 26%,#fff7d9,transparent 38%),linear-gradient(145deg,#e7f1eb,#fff4e5)}.scene img{width:100%;height:100%;object-fit:cover}.emoji{font-size:clamp(90px,24vw,165px);filter:drop-shadow(0 12px 18px rgba(0,0,0,.1));text-align:center;max-width:90%;line-height:1.05}.ans{height:100%;overflow:auto;padding:24px;text-align:center}.ansKa{font-family:"Noto Sans Georgian","DejaVu Sans",sans-serif;font-size:clamp(44px,9vw,73px);font-weight:830;line-height:1.08}.read{font-size:clamp(22px,5vw,31px);font-weight:760;margin-top:8px}.meaning{font-size:clamp(21px,5vw,31px);color:#4f5a54;margin-top:5px}.mnemo{text-align:left;max-width:520px;margin:20px auto;padding:16px;border:1px solid #d5e5db;border-radius:17px;background:#edf5f0;line-height:1.47}.mnemo b{color:var(--green)}.fullImg{display:block;max-width:92%;max-height:46%;object-fit:contain;margin:14px auto;border-radius:16px;border:1px solid var(--line)}.speak{position:absolute;right:14px;top:14px;width:43px;height:43px;border-radius:50%;background:white;font-size:19px;box-shadow:0 6px 16px rgba(0,0,0,.09);z-index:5}.actions{max-width:680px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.again{background:#f5e2e0;color:var(--red)}.good{background:#e0f0e5;color:#267348}.next{background:var(--green);color:white}.bar{height:7px;max-width:680px;margin:12px auto;background:#dfe6e1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0}@media(max-width:680px){header{display:block}.links{margin-top:10px}.toolbar{grid-template-columns:1fr 1fr}.shuffle{grid-column:1/-1}.card{height:65vh;min-height:455px}.actions{grid-template-columns:1fr 1fr}.next{grid-column:1/-1}}</style></head><body><div class="app"><header><div><h1>ქართული · мнемокарточки</h1><div class="sub">Слово → значение, картинка → слово, русский → грузинский или всё вперемешку.</div></div><div class="links"><a target="_blank" href="https://docs.google.com/spreadsheets/d/1dZ2_2VIDSQiIjXYH7lVPv5mu478AvjfUj3uT-g12ZuM/edit">Google Sheet</a><a target="_blank" href="https://drive.google.com/drive/folders/1IkA287QPhK-dKYJmza0weYv4nOowuwu2">Drive</a></div></header><div class="toolbar"><select id="mode"><option value="ka">ქართული → ответ</option><option value="scene">Картинка → ответ</option><option value="ru">Русский → ქართული</option><option value="mix">Смешанный</option></select><select id="cat"><option value="all">Все категории</option></select><button id="shuffle" class="shuffle">Перемешать</button></div><div class="meta"><span id="source" class="pill">Источник: загрузка…</span><span id="score" class="pill"></span><span id="counter" class="pill"></span></div><div class="stage"><div id="card" class="card"><div id="front" class="face"></div><div id="back" class="face back"></div></div></div><div class="actions"><button id="again" class="again">Не вспомнил</button><button id="good" class="good">Вспомнил</button><button id="next" class="next">Следующая</button></div><div class="bar"><i id="progress"></i></div></div><script>
const SHEET_ID='1dZ2_2VIDSQiIjXYH7lVPv5mu478AvjfUj3uT-g12ZuM';
const PAIRS={
'ფანჯარა':{scene:'12H1f1JinQA0CD79GOJP8QJw6yWEP_7IP',answer:'15oq00F8k1oJOIBJYE4E9OeMcIAHMTQg-'},'კედელი':{scene:'1KOhgHl1pDYKXgiR2_exkmvseckNYR6VA',answer:'1aRd-eyzDxR78OcL75wcC4Ye7M-VozAJP'},'ჭერი':{scene:'1s2WSE18UfKx6IpThWXvLLEJHjFumfXLU',answer:'1a0-714V1tOgpFQxX4EK8E2jSmu7Ax2N5'},'კარი':{scene:'1Lkpm17wF09A0E8WpmUpUotykeX53nFFg',answer:'1UDbiu1m8iZY_kLX58qTtBZhx4lBLQG5F'},'სკამი':{scene:'1kp24xi3prKIt8PmwQUbllxIy2guwPPHV',answer:'1CnAs1lajNADWLn6W1Q93PiLjoz5Hz0mn'},'ქუჩა':{scene:'1pUkVWn4m5yQhNKqsrNT3qNVywawnt7JA',answer:'1COTKVglKK-WBYq2jpnlqYq2V8vqV0Ci5'},'ბაღი':{scene:'1KbGWswtlQwP5Vp5yK3hG75Wwm8laGsb0',answer:'1qsV73FMbNyWE9uLLbjw3NUYqA-CdXPeU'},'ჭიქა':{scene:'18fdMOwLu-S-sac9lsVpgsdTFtvqjYp5p',answer:'1V-rXM-DMIE8ewHDXhtTXTgGyTgstJnzR'},'სიტყვა':{scene:'1GRMKrRCKifv3QC0-HCD5WVlvPLWgGzWH',answer:'1Empx29kY2EoMIm56W32RYGFDJYJSQp1f'}};
const iconRules=[[/окно/i,'🥵🪟'],[/стен/i,'👟🧱'],[/потол/i,'🍒💡'],[/двер/i,'🚪🍛'],[/стул/i,'🪑'],[/улиц/i,'🛣️📦'],[/сад/i,'🌷🏎️'],[/чаш|стакан/i,'☕👩'],[/слово/i,'🐸📖'],[/женщ/i,'👩'],[/мужчин/i,'👨'],[/человек/i,'🧍'],[/ребён/i,'👶'],[/жена/i,'👰'],[/муж$/i,'🤵'],[/мама|мать/i,'👩‍🍼'],[/папа|отец/i,'👨‍🍼'],[/животное/i,'🐾🦊'],[/рыба/i,'🐟📺'],[/птица/i,'🐦📖'],[/собака/i,'🐶'],[/змея/i,'🐍'],[/дерево/i,'🌳'],[/лес/i,'🌲🌲🌲'],[/фрукт/i,'🍎🌶️'],[/семя/i,'🌱🚗'],[/лист$/i,'🍃'],[/цветок/i,'🌸🐸'],[/трава/i,'🌿'],[/мясо/i,'🥩🎤'],[/кров/i,'🩸'],[/кость/i,'🦴🐶'],[/яйцо/i,'🥚💎'],[/хвост/i,'🐈➰'],[/волос/i,'💇'],[/голова/i,'🧑📺'],[/ухо/i,'👂🚬'],[/глаз/i,'👁️📺'],[/нос/i,'👃✋'],[/рот/i,'👄🍽️'],[/зуб/i,'🦷🔨'],[/ступн/i,'🦶🧱'],[/нога/i,'🦵'],[/колено/i,'🦵🪰'],[/рука/i,'✋'],[/живот|желуд/i,'🤰🧀'],[/шея/i,'🧣🥤'],[/спина/i,'🎒'],[/сердце/i,'❤️👹'],[/пить/i,'🥤😋'],[/есть \/ еда/i,'🍽️😋'],[/сме/i,'😂🏝️'],[/видеть/i,'👁️🖼️'],[/слыш/i,'👂🏭'],[/знать/i,'🧠📚'],[/думать/i,'🐷💭'],[/страх|бояться/i,'😱🌰'],[/сон|спать/i,'😴🛏️'],[/жить|жизнь/i,'🕰️🐾'],[/бороть/i,'🥊'],[/плавать/i,'🏊🏄'],[/летать/i,'✈️'],[/ходить/i,'🚶🛞'],[/приход/i,'🌉🚪'],[/лежать/i,'🥤🛏️'],[/сидеть/i,'🐸🪑'],[/стоять/i,'🧍🏠'],[/вращ|поворач/i,'🐻🔄'],[/падать/i,'🤸🪣'],[/давать/i,'🎁🤲'],[/держать/i,'✊🪢'],[/мыть/i,'🛁🌊'],[/тянуть/i,'🪢💪'],[/толкать/i,'💪🚗'],[/бросать/i,'🍣💨'],[/связывать/i,'🎀🐸'],[/шить/i,'🧵🪡'],[/считать/i,'📺🔢'],[/говорить/i,'🗣️👩'],[/петь/i,'🎤🎶'],[/солнце/i,'☀️😎'],[/луна/i,'🌙📺'],[/больш/i,'🐘🚪'],[/длинн/i,'📏🌱'],[/широк/i,'⚓🌊'],[/толст/i,'💀🪑'],[/тяж/i,'🏋️'],[/малень/i,'🐘☕'],[/корот/i,'📏🧴'],[/узк/i,'🗜️🛣️'],[/тонк/i,'🎈📄'],[/два/i,'🍪🍪'],[/три/i,'👤👤👤'],[/четыр/i,'😂😂😂😂'],[/кто/i,'🕵️🍷'],[/когда/i,'🎂📅'],[/как$/i,'🐐📖'],[/много/i,'🦫🦫🦫'],[/несколько/i,'👖🖼️'],[/немного|мало/i,'🍯🐝'],[/другой/i,'👉🔀'],[/мы$/i,'👥'],[/вы$/i,'👯'],[/они/i,'🔵🔵🔵'],[/он \/ она/i,'👨👩📦'],[/это/i,'👉🅢'],[/там/i,'🌄😮'],[/не$/i,'🏴‍☠️🚫'],[/всё/i,'📦🪑🐈🧀']];
let cards=[],deck=[],i=0,stats=JSON.parse(localStorage.getItem('geoMnemo2')||'{"r":0,"w":0}');const $=s=>document.querySelector(s);
function thumb(id,w=1100){return `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`}
function emoji(c){for(const [r,e] of iconRules)if(r.test(c.ru+' '+c.comment))return e;return '🧠✨'}
function parseGoogle(resp){const rows=resp.table.rows||[];return rows.slice(1).map(r=>{const c=r.c||[];return{ru:c[0]?.v||'',ka:c[1]?.v||'',latin:c[2]?.v||'',read:c[3]?.v||'',cat:c[4]?.v||'другое',comment:c[5]?.v||''}}).filter(x=>x.ka&&x.ru)}
function loadGoogle(){return new Promise((resolve,reject)=>{const cb='geoCb'+Date.now();window[cb]=r=>{try{const out=parseGoogle(r);delete window[cb];s.remove();out.length?resolve(out):reject()}catch(e){reject(e)}};const s=document.createElement('script');s.onerror=reject;s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent('Лексика')}&headers=1&tqx=responseHandler:${cb}`;document.head.appendChild(s);setTimeout(()=>reject(new Error('private')),5000)})}
async function loadSnapshot(){const t=await fetch('./index.html').then(r=>r.text());const m=t.match(/const RAW=`([\s\S]*?)`;\s*const IMAGE_MAP/);if(!m)throw Error('snapshot');return m[1].trim().split('\n').map(line=>{const [ka,read,ru,cat,hook]=line.split('|');return{ka,read,ru,cat,comment:'Мнемо: '+hook}})}
async function boot(){try{cards=await loadGoogle();$('#source').textContent='Источник: Google Sheet';}catch(e){cards=await loadSnapshot();$('#source').textContent='Источник: снимок Google Sheet';}cards=cards.filter((x,n,a)=>a.findIndex(y=>y.ka===x.ka)===n);const cats=[...new Set(cards.map(x=>x.cat))].sort();cats.forEach(x=>$('#cat').insertAdjacentHTML('beforeend',`<option>${x}</option>`));rebuild()}
function rebuild(){const c=$('#cat').value;deck=cards.filter(x=>c==='all'||x.cat===c).sort(()=>Math.random()-.5);i=0;render()}
function frontScene(c){const p=PAIRS[c.ka];if(!p)return `<div class="scene"><div class="emoji">${emoji(c)}</div><div class="hint">что за слово?</div></div>`;return `<div class="scene"><img src="${thumb(p.scene)}" onerror="this.outerHTML='<div class=emoji>${emoji(c)}</div>'"><div class="hint">что за слово?</div></div>`}
function render(){if(!deck.length)return;const c=deck[i%deck.length];$('#card').classList.remove('flip');let mode=$('#mode').value;if(mode==='mix')mode=['ka','scene','ru'][Math.floor(Math.random()*3)];$('#front').innerHTML=mode==='ka'?`<div class="center"><div class="ka">${c.ka}</div><div class="hint">что значит?</div></div>`:mode==='ru'?`<div class="center"><div class="ru">${c.ru}</div><div class="hint">как будет по-грузински?</div></div>`:frontScene(c);const p=PAIRS[c.ka];$('#back').innerHTML=`<button class="speak">🔊</button><div class="ans"><div class="ansKa">${c.ka}</div><div class="read">${c.read||c.latin||''}</div><div class="meaning">${c.ru}</div><div class="mnemo"><b>Мнемоника.</b> ${(c.comment||'').replace(/^Мнемо:\s*/,'')}</div>${p?`<img class="fullImg" src="${thumb(p.answer)}" onerror="this.remove()">`:''}</div>`;$('#back .speak').onclick=e=>{e.stopPropagation();speak(c.ka)};$('#counter').textContent=`${i%deck.length+1} / ${deck.length}`;$('#score').textContent=`✓ ${stats.r} · ✕ ${stats.w}`;$('#progress').style.width=`${((i%deck.length+1)/deck.length)*100}%`}
function next(){i=(i+1)%deck.length;render()}function grade(ok){ok?stats.r++:stats.w++;localStorage.setItem('geoMnemo2',JSON.stringify(stats));next()}function speak(t){if(!speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='ka-GE';u.rate=.78;speechSynthesis.cancel();speechSynthesis.speak(u)}
$('#card').onclick=()=>$('#card').classList.toggle('flip');$('#next').onclick=next;$('#again').onclick=()=>grade(false);$('#good').onclick=()=>grade(true);$('#shuffle').onclick=rebuild;$('#cat').onchange=rebuild;$('#mode').onchange=render;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('#card').classList.toggle('flip')}if(e.key==='ArrowRight')next();if(e.key==='1')grade(false);if(e.key==='2')grade(true)});boot().catch(e=>{$('#source').textContent='Ошибка загрузки';console.error(e)});
</script></body></html>
