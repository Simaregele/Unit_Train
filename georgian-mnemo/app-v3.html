<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173c31"><title>ქართული · Мнемокарточки</title><style>
:root{--bg:#eef2ed;--card:#fffdf8;--ink:#17201c;--muted:#69736d;--line:#dae2dc;--green:#2c6a52;--soft:#e6efe9;--red:#a44a42}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 5% 0,#d8eadf 0,transparent 28%),radial-gradient(circle at 98% 3%,#efe2c9 0,transparent 27%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.app{max-width:920px;margin:auto;padding:16px 12px 42px}h1{margin:0;font-size:clamp(28px,6vw,46px);letter-spacing:-.04em}.sub{color:var(--muted);margin:5px 0 14px}.toolbar{display:grid;grid-template-columns:1.4fr 1fr auto;gap:9px;background:#fffdf8d9;border:1px solid #fff;border-radius:17px;padding:11px}select,button{font:inherit}select{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f7f8f5;color:var(--ink)}button{border:0;border-radius:12px;padding:10px 13px;font-weight:760;cursor:pointer}.shuffle{background:var(--soft)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:10px 2px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px}.stage{max-width:680px;margin:auto;perspective:1400px}.card{height:min(69vh,660px);min-height:480px;position:relative;transform-style:preserve-3d;transition:.48s transform cubic-bezier(.2,.75,.2,1);cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;overflow:hidden;background:var(--card);border:1px solid #fff;box-shadow:0 22px 68px rgba(24,46,36,.12)}.back{transform:rotateY(180deg)}.scene{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#fff8df,transparent 38%),linear-gradient(145deg,#e8f1eb,#fff5e7);position:relative}.scene img{width:100%;height:100%;object-fit:cover}.emoji{font-size:clamp(95px,24vw,170px);text-align:center;filter:drop-shadow(0 12px 18px rgba(0,0,0,.1));line-height:1.08}.textOnly,.full{height:100%;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.full{justify-content:flex-start;overflow:auto;padding-top:20px}.ka{font-family:"Noto Sans Georgian","DejaVu Sans",sans-serif;font-size:clamp(50px,11vw,86px);font-weight:830;line-height:1.08}.read{font-size:clamp(22px,5vw,31px);font-weight:760;margin-top:8px}.ru{font-size:clamp(23px,5vw,34px);margin-top:5px;color:#4e5953}.mnemo{max-width:520px;width:100%;margin:15px auto;padding:14px;border-radius:16px;border:1px solid #d5e5db;background:#edf5f0;text-align:left;line-height:1.45}.mnemo b{color:var(--green)}.fullImage{width:min(470px,94%);height:min(42vh,330px);object-fit:cover;border-radius:18px;border:1px solid var(--line);margin-bottom:16px}.hint{position:absolute;left:0;right:0;bottom:15px;text-align:center;font-size:12px;color:#929c96;background:linear-gradient(transparent,#fffdf8 65%);padding-top:26px}.actions{max-width:680px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.again{background:#f5e2e0;color:var(--red)}.good{background:#e1f0e5;color:#257347}.next{background:var(--green);color:#fff}.bar{height:7px;max-width:680px;margin:12px auto;background:#dfe6e1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}@media(max-width:680px){.toolbar{grid-template-columns:1fr}.card{height:65vh;min-height:455px}.actions{grid-template-columns:1fr 1fr}.next{grid-column:1/-1}}
</style></head><body><div class="app"><h1>ქართული · мнемокарточки</h1><div class="sub">Три вида: полная, только картинка, только текст.</div><div class="toolbar"><select id="mode"><option value="full">Полная карточка</option><option value="image">Картинка без текста</option><option value="text">Текст без картинки</option></select><select id="cat"><option value="all">Все категории</option></select><button id="shuffle" class="shuffle">Перемешать</button></div><div class="meta"><span id="counter" class="pill"></span><span id="score" class="pill"></span></div><div class="stage"><div id="card" class="card"><div id="front" class="face"></div><div id="back" class="face back"></div></div></div><div class="actions"><button id="again" class="again">Не вспомнил</button><button id="good" class="good">Вспомнил</button><button id="next" class="next">Следующая</button></div><div class="bar"><i id="progress"></i></div></div><script>
const PAIRS={'ფანჯარა':'12H1f1JinQA0CD79GOJP8QJw6yWEP_7IP','კედელი':'1KOhgHl1pDYKXgiR2_exkmvseckNYR6VA','ჭერი':'1s2WSE18UfKx6IpThWXvLLEJHjFumfXLU','კარი':'1Lkpm17wF09A0E8WpmUpUotykeX53nFFg','სკამი':'1kp24xi3prKIt8PmwQUbllxIy2guwPPHV','ქუჩა':'1pUkVWn4m5yQhNKqsrNT3qNVywawnt7JA','ბაღი':'1KbGWswtlQwP5Vp5yK3hG75Wwm8laGsb0','ჭიქა':'18fdMOwLu-S-sac9lsVpgsdTFtvqjYp5p','სიტყვა':'1GRMKrRCKifv3QC0-HCD5WVlvPLWgGzWH'};
const icons=[[/окно/i,'🥵🪟'],[/стен/i,'👟🧱'],[/потол/i,'🍒💡'],[/двер/i,'🚪🍛'],[/стул/i,'🪑'],[/улиц/i,'🛣️📦'],[/сад/i,'🌷🏎️'],[/чаш|стакан/i,'☕👩'],[/слово/i,'🐸📖'],[/женщ/i,'👩'],[/мужчин/i,'👨'],[/человек/i,'🧍'],[/ребён/i,'👶'],[/мама|мать/i,'👩‍🍼'],[/папа|отец/i,'👨‍🍼'],[/рыба/i,'🐟📺'],[/птица/i,'🐦📖'],[/собака/i,'🐶'],[/змея/i,'🐍'],[/дерево/i,'🌳'],[/лес/i,'🌲🌲🌲'],[/цветок/i,'🌸🐸'],[/трава/i,'🌿'],[/мясо/i,'🥩🎤'],[/кров/i,'🩸'],[/кость/i,'🦴🐶'],[/яйцо/i,'🥚💎'],[/хвост/i,'🐈➰'],[/волос/i,'💇'],[/голова/i,'🧑📺'],[/ухо/i,'👂'],[/глаз/i,'👁️'],[/нос/i,'👃'],[/рот/i,'👄'],[/зуб/i,'🦷'],[/нога|ступн/i,'🦵'],[/колено/i,'🦵🪰'],[/рука/i,'✋'],[/сердце/i,'❤️'],[/пить/i,'🥤'],[/есть \/ еда/i,'🍽️'],[/сме/i,'😂'],[/видеть/i,'👁️🖼️'],[/слыш/i,'👂'],[/знать/i,'🧠📚'],[/думать/i,'🐷💭'],[/страх/i,'😱'],[/сон|спать/i,'😴'],[/плавать/i,'🏊'],[/летать/i,'✈️'],[/ходить/i,'🚶'],[/лежать/i,'🛏️'],[/сидеть/i,'🐸🪑'],[/стоять/i,'🧍'],[/падать/i,'🤸'],[/давать/i,'🎁'],[/держать/i,'✊'],[/мыть/i,'🛁'],[/тянуть/i,'🪢'],[/толкать/i,'💪🚗'],[/бросать/i,'🍣💨'],[/шить/i,'🧵🪡'],[/говорить/i,'🗣️'],[/петь/i,'🎤🎶'],[/солнце/i,'☀️'],[/луна/i,'🌙'],[/больш/i,'🐘'],[/малень/i,'🐘☕'],[/длинн/i,'📏'],[/корот/i,'📏'],[/широк/i,'↔️'],[/узк/i,'🗜️'],[/тяж/i,'🏋️'],[/два/i,'🍪🍪'],[/три/i,'👤👤👤'],[/четыр/i,'4️⃣'],[/кто/i,'🕵️🍷'],[/когда/i,'🎂📅'],[/много/i,'🦫🦫🦫'],[/немного|мало/i,'🍯🐝']];
let cards=[],deck=[],idx=0,stats=JSON.parse(localStorage.getItem('geoMnemo3')||'{"r":0,"w":0}');const $=s=>document.querySelector(s);
function emoji(c){for(const [r,e] of icons)if(r.test(c.ru+' '+c.hook))return e;return '🧠✨'}function thumb(id){return `https://drive.google.com/thumbnail?id=${id}&sz=w1200`}
async function load(){try{const t=await fetch('index.html').then(r=>r.text());const m=t.match(/const RAW=`([\s\S]*?)`;\s*const IMAGE_MAP/);if(!m)throw 0;cards=m[1].trim().split('\n').map((x,n)=>{const [ka,read,ru,cat,hook]=x.split('|');return{id:n,ka,read,ru,cat,hook}})}catch(e){document.querySelector('.sub').textContent='Не удалось загрузить словарь.';return}const cats=[...new Set(cards.map(x=>x.cat))].sort();cats.forEach(c=>$('#cat').insertAdjacentHTML('beforeend',`<option>${c}</option>`));rebuild()}
function scene(c){const id=PAIRS[c.ka];if(id)return `<div class="scene"><img src="${thumb(id)}" onerror="this.outerHTML='<div class=&quot;emoji&quot;>${emoji(c)}</div>'"></div>`;return `<div class="scene"><div class="emoji">${emoji(c)}</div></div>`}
function text(c){return `<div class="textOnly"><div class="ka">${c.ka}</div><div class="read">${c.read}</div><div class="ru">${c.ru}</div></div>`}
function full(c){return `<div class="full">${PAIRS[c.ka]?`<img class="fullImage" src="${thumb(PAIRS[c.ka])}" onerror="this.outerHTML='<div class=&quot;emoji&quot;>${emoji(c)}</div>'">`:`<div class="emoji" style="font-size:90px;margin:5px 0 15px">${emoji(c)}</div>`}<div class="ka">${c.ka}</div><div class="read">${c.read}</div><div class="ru">${c.ru}</div><div class="mnemo"><b>Созвучие:</b> ${c.hook||'—'}</div></div>`}
function rebuild(){const cat=$('#cat').value;deck=cards.filter(c=>cat==='all'||c.cat===cat).sort(()=>Math.random()-.5);idx=0;render()}
function render(){if(!deck.length)return;const c=deck[idx%deck.length],m=$('#mode').value;$('#card').classList.remove('flip');$('#front').innerHTML=m==='full'?full(c):m==='image'?scene(c)+`<div class="hint">Нажми — показать полную карточку</div>`:text(c)+`<div class="hint">Нажми — показать картинку и ответ</div>`;$('#back').innerHTML=full(c);$('#counter').textContent=`${idx%deck.length+1} / ${deck.length}`;$('#score').textContent=`✓ ${stats.r} · ✕ ${stats.w}`;$('#progress').style.width=`${(idx%deck.length+1)/deck.length*100}%`}
function next(){idx=(idx+1)%deck.length;render()}function grade(ok){ok?stats.r++:stats.w++;localStorage.setItem('geoMnemo3',JSON.stringify(stats));next()}$('#card').onclick=()=>{$('#card').classList.toggle('flip')};$('#again').onclick=()=>grade(false);$('#good').onclick=()=>grade(true);$('#next').onclick=next;$('#shuffle').onclick=rebuild;$('#cat').onchange=rebuild;$('#mode').onchange=render;load();
</script></body></html>
