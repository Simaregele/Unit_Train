<style>
:root{--bg:#f3f0e7;--card:#fffdf7;--ink:#182019;--muted:#667168;--green:#385f49;--soft:#e5eee7;--red:#a54d45;--line:#d9dfd8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#dcecdf 0,transparent 28%),radial-gradient(circle at 100% 0,#f5e2ca 0,transparent 28%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}.app{max-width:930px;margin:auto;padding:16px 12px 44px}h1{font-size:clamp(27px,6vw,44px);letter-spacing:-.04em;margin:0}.sub{color:var(--muted);margin:5px 0 14px}.toolbar{display:grid;grid-template-columns:1.4fr auto auto;gap:9px;background:#fffdf8db;border:1px solid #fff;border-radius:18px;padding:11px;margin-bottom:10px}select,button{font:inherit}select{border:1px solid var(--line);border-radius:12px;background:#fafaf6;padding:10px;color:var(--ink)}button{border:0;border-radius:12px;padding:10px 14px;font-weight:750;cursor:pointer}.secondary{background:var(--soft);color:var(--ink)}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin:9px 2px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 9px}.stage{max-width:590px;margin:auto;perspective:1500px}.card{position:relative;aspect-ratio:2/3;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.75,.2,1);cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:25px;overflow:hidden;background:var(--card);border:1px solid #fff;box-shadow:0 22px 70px rgba(31,50,39,.15);display:flex;align-items:center;justify-content:center}.back{transform:rotateY(180deg)}.face img{width:100%;height:100%;object-fit:contain;display:block;background:#fffdf8}.textonly{height:100%;width:100%;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;background:linear-gradient(145deg,#fffdf6,#f7f2e6)}.ka{font-family:"Noto Sans Georgian","DejaVu Sans",sans-serif;font-weight:850;font-size:clamp(62px,14vw,116px);line-height:1.08}.tap{position:absolute;bottom:17px;left:0;right:0;text-align:center;color:#7b847e;font-size:12px;background:linear-gradient(transparent,#fffdf7 65%);padding-top:28px}.error{padding:35px;text-align:center;color:#8c4b44;line-height:1.5}.actions{max-width:590px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.prev,.next{background:var(--green);color:#fff}.again{background:#f4e1df;color:var(--red)}.good{background:#e1f0e5;color:#277048}.hidden{display:none!important}.bar{height:7px;max-width:590px;margin:12px auto;background:#dfe5df;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}@media(max-width:640px){.toolbar{grid-template-columns:1fr 1fr}.toolbar select{grid-column:1/-1}.actions{grid-template-columns:1fr 1fr}.card{max-height:70vh;margin:auto}.ka{font-size:clamp(58px,18vw,96px)}}
</style>
</head>
<body><div class="app"><h1>ქართული · мнемокарточки</h1><div class="sub">Только красивые карточки с полноценной иллюстрацией.</div><div class="toolbar"><select id="mode"><option value="full">Полная карточка</option><option value="image">Картинка без текста</option><option value="text">Только грузинское слово</option></select><button id="shuffle" class="secondary">Перемешать</button><button id="random" class="secondary">Случайная</button></div><div class="meta"><span class="pill" id="counter"></span><span class="pill" id="score"></span><span class="pill">29 пар</span></div><div class="stage"><div id="card" class="card"><div id="front" class="face"></div><div id="back" class="face back"></div></div></div><div class="actions"><button id="prev" class="prev">← Назад</button><button id="again" class="again">Не вспомнил</button><button id="good" class="good">Вспомнил</button><button id="next" class="next">Дальше →</button></div><div class="bar"><i id="progress"></i></div></div>

let deck=[...CARDS],idx=0,stats=JSON.parse(localStorage.getItem('geoPretty7')||'{"r":0,"w":0}');const $=s=>document.querySelector(s),url=id=>`https://drive.google.com/thumbnail?id=${id}&sz=w1600`;
function img(id){return `<img src="${url(id)}" alt="" onerror="this.outerHTML='<div class=&quot;error&quot;>Изображение не загрузилось из Google Drive.<br>Проверь доступ к Drive.</div>'">`}
function render(){const c=deck[idx],m=$('#mode').value;$('#card').classList.remove('flip');if(m==='full'){$('#front').innerHTML=img(c.full);$('#back').innerHTML='';$('#card').style.cursor='default';$('#again').classList.add('hidden');$('#good').classList.add('hidden')}else if(m==='image'){$('#front').innerHTML=img(c.image)+'<div class="tap">Нажми — показать ответ</div>';$('#back').innerHTML=img(c.full);$('#card').style.cursor='pointer';$('#again').classList.remove('hidden');$('#good').classList.remove('hidden')}else{$('#front').innerHTML=`<div class="textonly"><div class="ka">${c.ka}</div></div><div class="tap">Нажми — показать ответ</div>`;$('#back').innerHTML=img(c.full);$('#card').style.cursor='pointer';$('#again').classList.remove('hidden');$('#good').classList.remove('hidden')}$('#counter').textContent=`${idx+1} / ${deck.length}`;$('#score').textContent=`✓ ${stats.r} · ✕ ${stats.w}`;$('#progress').style.width=`${(idx+1)/deck.length*100}%`}
function next(){idx=(idx+1)%deck.length;render()}function prev(){idx=(idx-1+deck.length)%deck.length;render()}function grade(ok){ok?stats.r++:stats.w++;localStorage.setItem('geoPretty7',JSON.stringify(stats));next()}
$('#card').onclick=()=>{if($('#mode').value!=='full')$('#card').classList.toggle('flip')};$('#next').onclick=next;$('#prev').onclick=prev;$('#good').onclick=()=>grade(true);$('#again').onclick=()=>grade(false);$('#mode').onchange=render;$('#shuffle').onclick=()=>{deck.sort(()=>Math.random()-.5);idx=0;render()};$('#random').onclick=()=>{idx=Math.floor(Math.random()*deck.length);render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.code==='Space'&&$('#mode').value!=='full'){e.preventDefault();$('#card').classList.toggle('flip')}});render();
</script></body></html>
