const catEmoji={'основы':'🧠','местоимения':'👥','направления':'🧭','вопросы':'❓','количество':'🔢','числа':'🔢','описание':'📐','люди':'🧍','семья':'🏠','животные':'🐾','природа':'🌿','еда':'🍽️','еда / посуда':'🍽️','тело':'🫀','действия':'⚡','эмоции':'🙂','быт':'🏠','дом':'🏠','город':'🏙️','базовая лексика':'🔤'};
function emojis(c){for(const [r,e] of iconRules){if(r.test(c.ru+' '+c.hook))return e}return catEmoji[c.cat]||'🧠✨'}
const $=s=>document.querySelector(s);let deck=[],idx=0,flipped=false;let stats=JSON.parse(localStorage.getItem('geoMnemoStats')||'{"right":0,"wrong":0}');
function driveThumb(id,w=1100){return `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`}
function categories(){[...new Set(cards.map(c=>c.cat))].sort().forEach(c=>$('#cat').insertAdjacentHTML('beforeend',`<option>${c}</option>`))}
function rebuild(){const cat=$('#cat').value;deck=cards.filter(c=>cat==='all'||c.cat===cat);deck.sort(()=>Math.random()-.5);idx=0;render()}
function fallbackScene(c){return `<div class="scene"><div class="emojiScene">${emojis(c)}</div><div class="hint">нажми, чтобы открыть ответ</div></div>`}
function frontFor(c){let mode=$('#mode').value;if(mode==='mix')mode=['ka','scene','ru'][Math.floor(Math.random()*3)];if(mode==='ka')return `<div class="frontInner"><div class="frontWord">${c.ka}</div><div class="hint">что это значит?</div></div>`;if(mode==='ru')return `<div class="frontInner"><div class="frontRu">${c.ru}</div><div class="hint">как будет по-грузински?</div></div>`;const im=IMAGE_MAP[c.ka];if(im)return `<div class="scene" style="aspect-ratio:${im[1]}"><img class="sceneImg" src="${driveThumb(im[0])}" onerror="this.parentNode.outerHTML=window.fallbackSceneById(${c.id})"><div class="hint">что за слово?</div></div>`;return fallbackScene(c)}
window.fallbackSceneById=id=>fallbackScene(cards.find(x=>x.id===id));
function backFor(c){const im=IMAGE_MAP[c.ka];return `<button class="speak" onclick="event.stopPropagation();speak('${c.ka.replace(/'/g,"\\'")}')">🔊</button><div class="answerText"><div class="answerKa">${c.ka}</div><div class="reading">${c.read}</div><div class="meaning">${c.ru}</div><div class="mnemo"><b>Созвучие:</b> ${c.hook}<br><span style="color:#667069">Свяжи это созвучие с абсурдной сценой на карточке.</span></div>${im?`<img class="answerImage" src="${driveThumb(im[0])}" onerror="this.remove()">`:''}</div>`}
function render(){if(!deck.length){$('#front').innerHTML='<div class="empty">Нет карточек</div>';return}const c=deck[idx%deck.length];flipped=false;$('#card').classList.remove('flipped');$('#front').innerHTML=frontFor(c);$('#back').innerHTML=backFor(c);$('#counter').textContent=`${idx%deck.length+1} / ${deck.length}`;$('#score').textContent=`✓ ${stats.right} · ✕ ${stats.wrong}`;$('#progress').style.width=`${((idx%deck.length+1)/deck.length)*100}%`}
function flip(){flipped=!flipped;$('#card').classList.toggle('flipped',flipped)}function next(){idx=(idx+1)%deck.length;render()}function grade(ok){ok?stats.right++:stats.wrong++;localStorage.setItem('geoMnemoStats',JSON.stringify(stats));$('#score').textContent=`✓ ${stats.right} · ✕ ${stats.wrong}`;next()}function speak(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='ka-GE';u.rate=.78;speechSynthesis.cancel();speechSynthesis.speak(u)}
$('#card').onclick=flip;$('#next').onclick=next;$('#good').onclick=()=>grade(true);$('#again').onclick=()=>grade(false);$('#shuffle').onclick=rebuild;$('#cat').onchange=rebuild;$('#mode').onchange=render;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flip()}if(e.key==='ArrowRight')next();if(e.key==='1')grade(false);if(e.key==='2')grade(true)});categories();rebuild();
</script>
